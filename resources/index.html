<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motivo — Procedural Game Music</title>
  <link rel="icon" href="/icons/appIcon.png">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <!-- ── Top bar ─────────────────────────────────────────── -->
    <header class="topbar">
      <div class="tb-left">
        <div class="brand">
          <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1205" stroke-width="2.4" stroke-linecap="round"><path d="M3 14c1.5 0 1.5-6 3-6s1.5 10 3 10 1.5-14 3-14 1.5 12 3 12 1.5-6 3-6 1.5 3 3 3"/></svg></div>
          <span>Motivo</span>
        </div>
        <div class="vsep"></div>
        <button type="button" class="btn sm" id="btnNew" title="New track wizard (N)"></button>
        <input id="trackName" class="track-name" spellcheck="false" maxlength="60" title="Track name" aria-label="Track name">
      </div>

      <div class="tb-center">
        <div class="transport">
          <button type="button" class="tbtn" id="btnBack" title="Back to start (Home)"></button>
          <button type="button" class="play-btn" id="btnPlay" title="Play / Pause (Space)" aria-label="Play"></button>
          <button type="button" class="tbtn" id="btnStop" title="Stop"></button>
          <button type="button" class="tbtn toggle" id="btnRepeat" title="Repeat one-shot preview"></button>
        </div>
        <div class="time">
          <div class="t-main"><span id="tPos">0:00</span><span class="t-dim"> / <span id="tLen">0:00</span></span></div>
          <div class="t-sub"><span id="tBar">1.1</span><span id="tCycle" class="t-cycle"></span></div>
        </div>
      </div>

      <div class="tb-right">
        <div class="hist" role="group" aria-label="History">
          <button type="button" class="btn icon ghost" id="btnUndo" disabled></button>
          <button type="button" class="btn icon ghost" id="btnRedo" disabled></button>
        </div>
        <div class="seed" title="Seed — same seed + parameters = same track">
          <span class="seed-l">SEED</span>
          <input id="seedInput" spellcheck="false" aria-label="Seed">
          <button type="button" class="seed-dice" id="btnDice" title="New seed (G)"></button>
        </div>
        <button type="button" class="btn primary" id="btnGenerate" title="Generate a new variation (G)"></button>
        <button type="button" class="btn icon" id="btnSave" title="Save to library"></button>
        <button type="button" class="btn" id="btnExport" title="Export (E)"></button>
      </div>
    </header>

    <!-- ── Main ────────────────────────────────────────────── -->
    <main class="main">
      <aside class="sidebar">
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-tab="themes" role="tab" aria-selected="true" aria-controls="pane-themes">Themes</button>
          <button type="button" class="tab" data-tab="library" role="tab" aria-selected="false" aria-controls="pane-library">Library <span class="badge" id="libCount">0</span></button>
        </div>
        <div class="tab-pane" id="pane-themes">
          <div class="search"><span id="searchIc"></span><input id="presetSearch" placeholder="Search themes…" spellcheck="false" aria-label="Search themes"></div>
          <div class="preset-list" id="presetList"></div>
        </div>
        <div class="tab-pane hidden" id="pane-library">
          <div class="lib-actions">
            <button type="button" class="btn sm" id="btnImport" title="Import a project or a library backup"></button>
            <button type="button" class="btn sm" id="btnExportLib" title="Save a backup of your library"></button>
          </div>
          <div class="lib-scroll">
            <div class="group-h">Saved tracks</div>
            <div id="libSaved" class="lib-list"></div>
            <div class="group-h">Recent generations</div>
            <div id="libRecent" class="lib-list"></div>
          </div>
        </div>
      </aside>

      <section class="center">
        <div class="card hero">
          <div class="hero-main">
            <div class="hero-kicker" id="heroKicker">Theme</div>
            <div class="hero-title" id="heroTitle">—</div>
            <div class="hero-desc" id="heroDesc"></div>
          </div>
          <div class="stats" id="stats"></div>
        </div>

        <div class="card viz">
          <canvas id="vizCanvas"></canvas>
          <div class="viz-overlay">
            <div class="now">
              <div class="now-k">NOW PLAYING</div>
              <div class="now-chord" id="nowChord">—</div>
              <div class="now-sec" id="nowSection"></div>
            </div>
            <div class="next">
              <div class="now-k">NEXT</div>
              <div class="next-chord" id="nextChord">—</div>
            </div>
          </div>
          <div class="viz-hint" id="vizHint">Press <kbd>Space</kbd> to play</div>
        </div>

        <div class="card arr-card">
          <div class="card-h">
            <div class="title"><span id="arrIc"></span>Arrangement</div>
            <div class="arr-legend" id="arrLegend"></div>
          </div>
          <div class="arr-wrap" id="arrWrap">
            <canvas id="arrCanvas"></canvas>
            <canvas id="arrHead"></canvas>
          </div>
        </div>

        <div class="card mixer-card">
          <div class="card-h">
            <div class="title"><span id="mixIc"></span>Mixer &amp; Orchestration</div>
            <div class="card-h-note">Instrument and mix changes apply live</div>
          </div>
          <div class="mixer" id="mixer"></div>
        </div>
      </section>

      <aside class="inspector">
        <div class="insp-h">
          <div class="insp-title"><span id="inspIc"></span>Parameters</div>
          <div class="insp-actions">
            <button type="button" class="btn icon sm" id="btnRandomize" title="Randomize mood (R)"></button>
            <button type="button" class="btn icon sm" id="btnResetStyle" title="Reset to genre defaults"></button>
          </div>
        </div>
        <label class="autoregen" title="Regenerate automatically when composition parameters change">
          <span>Auto-regenerate on change</span>
          <span class="switch"><input type="checkbox" id="autoRegen" checked><i></i></span>
        </label>
        <div class="insp-body" id="inspector"></div>
      </aside>
    </main>

    <footer class="statusbar">
      <div class="sb-left"><span class="dot" id="audioDot"></span><span id="statusText" role="status" aria-live="polite">Ready</span></div>
      <div class="sb-right"><span class="sb-keys" id="statusKeys"></span><button type="button" class="sb-ver" id="btnVersion"></button></div>
    </footer>
  </div>

  <!-- ── Export dialog ─────────────────────────────────────── -->
  <div class="modal-bg" id="exportModal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="exTitle">
      <div class="modal-h">
        <div><div class="modal-title" id="exTitle">Export</div><div class="modal-sub" id="exSub"></div></div>
        <button type="button" class="btn icon ghost" id="exClose" title="Close"></button>
      </div>
      <div class="modal-b">
        <div class="formats" id="exFormats"></div>
        <div class="ex-opts" id="exOpts"></div>
        <div class="ex-note" id="exNote"></div>
        <div class="progress hidden" id="exProgress"><i></i><span>Rendering…</span></div>
      </div>
      <div class="modal-f">
        <button type="button" class="btn" id="exCancel">Cancel</button>
        <button type="button" class="btn primary" id="exGo">Export</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="/js/neutralino.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
